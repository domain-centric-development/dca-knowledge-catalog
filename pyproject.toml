[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dca-catalog"
version = "0.1.0"
description = "Generate an Open Knowledge Format (OKF) bundle from the DCA reference implementation"
requires-python = ">=3.10"
dependencies = []  # generator is stdlib-only

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
dca-catalog = "dca_catalog.generate:main"
dca-mirror = "dca_catalog.mirror:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
